name: Nightly APKs

"on":
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuttymod-nightly
  cancel-in-progress: false

jobs:
  nightly:
    if: github.repository == 'the-nuttyVR-project/nuttyVR-nuttymod-loader-for-beat-saber' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUTTYVR_BUILD_TOOLS: '35.0.0'
    steps:
      - name: Check out the project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signed nightly APKs
        env:
          NUTTYMOD_KEYSTORE_BASE64: ${{ secrets.NUTTYMOD_KEYSTORE_BASE64 }}
          NUTTYMOD_KEY_PASSWORD: ${{ secrets.NUTTYMOD_KEY_PASSWORD }}
        run: python3 tools/prepare_nightly.py prepare
      - name: Test profiles, APK identity and bundled dependencies
        run: bash test.sh
      - name: Package downloads and source
        run: |
          python3 tools/package_release.py
          python3 tools/prepare_nightly.py stage
      - name: Upload the complete APK toolkit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuttyvr-nightly
          path: build/nightly/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload just the Hub
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuttyvr-hub
          path: |
            dist/nuttyVR hub.apk
            dist/SHA256SUMS
            dist/NIGHTLY.json
          if-no-files-found: error
          retention-days: 14
      - name: Show public download links
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## nuttyVR nightly downloads
          - [All APKs, source and installation guide](https://nightly.link/the-nuttyVR-project/nuttyVR-nuttymod-loader-for-beat-saber/workflows/nightly/main/nuttyvr-nightly.zip)
          - [Hub APK ZIP](https://nightly.link/the-nuttyVR-project/nuttyVR-nuttymod-loader-for-beat-saber/workflows/nightly/main/nuttyvr-hub.zip)

          Extract the ZIP before installing an APK. See NIGHTLY.json for the source commit and whether this run rebuilt from source or verified the signed snapshot.

          Beat Saber injection and granting root are not implemented. The demo game provides the included NuttyMod integration.
          EOF
